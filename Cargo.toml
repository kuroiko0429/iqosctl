[package]
name = "iqosctl"
description = "Fork of iqos_cli: a command-line interface for controlling IQOS devices over BLE"
version = "1.0.1"
edition = "2021"
rust-version = "1.92"

[[bin]]
name = "iqos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "5"
btleplug = "0.11"
colored = "3.0"
futures = "0.3"
iqos = { version = "1.1.1", features = ["btleplug-support"] }
rustyline = "11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"

[patch.crates-io]
bluez-async = { path = "vendor-bluez-async/bluez-async" }
iqos = { path = "vendor-iqos" }
